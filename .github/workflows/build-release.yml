name: "Build Multi-Plateforme"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-20.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Studeo ${{ github.ref_name }}"
          releaseBody: |
            ## 🎉 Studeo ${{ github.ref_name }}

            ### 📦 Téléchargements
            - **macOS** : Téléchargez le fichier `.dmg` ou `.app`
            - **Windows** : Téléchargez le fichier `.msi` ou `.exe`

            ### ✨ Nouveautés
            Voir le [CHANGELOG](https://github.com/${{ github.repository }}/blob/main/CHANGELOG_AUDIT_2026_01_13.md)

            ### 🌐 Version Web
            Accessible sur : https://studeo.vercel.app
          releaseDraft: false
          prerelease: false
          args: --verbose
