name: Keep Supabase Alive

on:
  schedule:
    # S'exécute à 08:00 tous les 3 jours
    - cron: '0 8 */3 * *'
  workflow_dispatch: # Permet de le lancer manuellement depuis l'interface GitHub

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase API
        run: |
          curl -i -X GET "https://lpvwipvtwtxmnluqolsd.supabase.co/rest/v1/"
