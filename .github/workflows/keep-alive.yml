name: Keep Supabase Alive

on:
  schedule:
    # S'exécute tous les 3 jours à 09:00 UTC (marge confortable sous les 7 jours de la limite Supabase)
    # Le cron Vercel (vercel.json, daily à 8h UTC) est le mécanisme principal.
    - cron: '0 9 */3 * *'
  workflow_dispatch: # Permet de le lancer manuellement depuis GitHub Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (nécessaire pour le self-commit)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Ping Supabase DB via REST (requête PostgREST authentifiée)
        run: |
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            "https://lpvwipvtwtxmnluqolsd.supabase.co/rest/v1/profiles?select=id&limit=1")
          echo "Supabase HTTP status: $RESPONSE"
          # 200 = OK, 406 = RLS bloque mais la DB a répondu (compte quand même)
          if [ "$RESPONSE" != "200" ] && [ "$RESPONSE" != "406" ]; then
            echo "❌ Ping DB échoué avec le code $RESPONSE"
            exit 1
          fi
          echo "✅ Supabase DB est actif (code $RESPONSE)"

      - name: Self-commit pour maintenir le repo actif (évite la désactivation GitHub Actions)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" > .github/last-keepalive.txt
          git add .github/last-keepalive.txt
          git commit -m "chore: keep-alive ping [skip ci]" || echo "Rien à commiter"
          git push || echo "Push optionnel échoué (non bloquant)"
