name: Keep Supabase Alive

on:
  schedule:
    # S'exécute à 08:00 tous les 5 jours (en dessous des 7 jours de la limite Supabase)
    - cron: '0 8 */5 * *'
  workflow_dispatch: # Permet de le lancer manuellement depuis GitHub Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase DB (requête authentifiée)
        run: |
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            "https://lpvwipvtwtxmnluqolsd.supabase.co/rest/v1/profiles?select=id&limit=1")
          echo "Supabase HTTP status: $RESPONSE"
          if [ "$RESPONSE" != "200" ] && [ "$RESPONSE" != "406" ]; then
            echo "❌ Ping échoué avec le code $RESPONSE"
            exit 1
          fi
          echo "✅ Supabase est actif"
