<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <title>Studeo - L'outil pour tout apprendre</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Meta tags PWA -->
    <meta name="theme-color" content="#6366f1" />
    <meta name="description" content="Application d'apprentissage intelligente avec IA - Flashcards, Quiz, SRS et plus encore" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Studeo" />
    
    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icon-152.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/icon-192.png" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <script>
      // POLYFILLS pour iPad Air 2 (iOS 15.0 - 15.7)
      if (!Array.prototype.at) {
        Array.prototype.at = function(n) {
          n = Math.trunc(n) || 0;
          if (n < 0) n += this.length;
          if (n < 0 || n >= this.length) return undefined;
          return this[n];
        };
      }
      if (typeof structuredClone !== 'function') {
        window.structuredClone = function(obj) { return JSON.parse(JSON.stringify(obj)); };
      }

      // Diagnostic
      window.onerror = function(msg, url, line, col, error) {
        var root = document.getElementById('root');
        if (root) {
          root.innerHTML = '<div style="padding: 20px; color: red; font-family: sans-serif;">' +
            '<h3>⚠️ Erreur Technique</h3>' +
            '<p style="background: #fee; padding: 10px; border-radius: 4px; font-size: small;">' + msg + '</p>' +
            '<small>' + url + ' (L:' + line + ')</small>' +
            '<div style="margin-top:20px"><button onclick="localStorage.clear();location.reload();" style="padding:10px;background:#4f46e5;color:white;border:none;border-radius:5px">Réinitialiser l\'application</button></div>' +
            '</div>';
        }
        return false;
      };
    </script>
  </head>
  <body
    class="bg-background-secondary text-text transition-colors duration-200"
  >
    <div id="root">
      <style>
        .studeo-loader-overlay {
          display: flex;
          flex-direction: column;
          justify-content: center;
          align-items: center;
          height: 100vh;
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
          background-color: transparent;
        }
        .studeo-spinner {
          width: 44px;
          height: 44px;
          border: 3.5px solid rgba(99, 102, 241, 0.2);
          border-left-color: #6366f1; /* Primary Studeo color */
          border-radius: 50%;
          animation: studeo-spin 0.9s linear infinite;
          margin-bottom: 16px;
        }
        @keyframes studeo-spin {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }
        .studeo-loader-text {
          color: #64748b;
          font-size: 14px;
          font-weight: 500;
          animation: studeo-pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @media (prefers-color-scheme: dark) {
          .studeo-loader-text { color: #94a3b8; }
        }
        @keyframes studeo-pulse {
          0%, 100% { opacity: 1; }
          50% { opacity: 0.5; }
        }
      </style>
      <div class="studeo-loader-overlay">
        <div class="studeo-spinner"></div>
        <div class="studeo-loader-text">Démarrage de Studeo...</div>
      </div>
    </div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
